services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: heart
      POSTGRES_PASSWORD: heart
      POSTGRES_DB: heart_disease
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heart -d heart_disease"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      DB_URL: postgresql://heart:heart@db:5432/heart_disease
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
